# =============================================================================
# docker-compose.yml — Production-Ready Infrastructure Orchestration
# =============================================================================
# ---------------------------------------------------------------------------
# Airflow common configuration (anchor for YAML reuse)
# ---------------------------------------------------------------------------
x-airflow-common: &airflow-common
  image: apache/airflow:2.7.1
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    - AIRFLOW__CORE__FERNET_KEY=46BKJoQYlPPOexq0OhDZnIlB7JAIFKpmfOQpPRXcEdA=
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__LOGGING_LEVEL=INFO
    # NOTE: No _PIP_ADDITIONAL_REQUIREMENTS — Airflow delegates Snowflake
    #       loading to the Spark container via docker exec + spark-submit.
  volumes:
    - ./dags:/opt/airflow/dags
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
    - /usr/bin/docker:/usr/bin/docker
  depends_on:
    postgres:
      condition: service_healthy

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ── PostgreSQL (Airflow metadata database) ──
  postgres:
    image: postgres:13
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  # ── Airflow: DB migration + admin user creation ──
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com
      "
    depends_on:
      postgres:
        condition: service_healthy

  # ── Airflow Webserver (UI on port 8080) ──
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow Scheduler (triggers DAG runs) ──
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Hadoop NameNode (HDFS metadata) ──
  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
    volumes:
      - namenode:/hadoop/dfs/name

  # ── Hadoop DataNode (HDFS block storage) ──
  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode
    depends_on:
      - hadoop-namenode
    environment:
      SERVICE_PRECONDITION: "hadoop-namenode:9870"
      CORE_CONF_fs_defaultFS: "hdfs://hadoop-namenode:9000"
    volumes:
      - datanode:/hadoop/dfs/data

  # ── Infrastructure Setup (transient init container) ──
  # Handles system-level concerns that should NOT live in Airflow:
  #   1. Fix Docker socket permissions so Airflow can docker exec
  #   2. Wait for NameNode to fully initialise
  #   3. Force HDFS out of safe mode
  infra-setup:
    image: docker:cli
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - hadoop-namenode
    command: >
      sh -c "
      echo '[infra-setup] Fixing Docker socket permissions...' &&
      chmod 666 /var/run/docker.sock &&
      echo '[infra-setup] Waiting 30s for NameNode to initialise...' &&
      sleep 30 &&
      echo '[infra-setup] Leaving HDFS safe mode...' &&
      docker exec hadoop-namenode hdfs dfsadmin -safemode leave || true &&
      echo '[infra-setup] ✅ Infrastructure ready.'
      "

  # ── Spark Master (cluster manager) ──
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "9090:8080"
      - "7077:7077"

  # ── Spark + Jupyter (PySpark execution engine) ──
  # Built from Dockerfile.spark — all dependencies are pre-installed.
  spark-jupyter:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-jupyter
    user: root
    env_file:
      - .env
    environment:
      - GRANT_SUDO=yes
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data
    depends_on:
      - spark-master
    # Clean command: only starts the notebook server. No pip installs.
    command: start-notebook.sh --NotebookApp.token=''

# ---------------------------------------------------------------------------
# Named volumes (persistent across container restarts)
# ---------------------------------------------------------------------------
volumes:
  namenode:
  datanode:
